# Описание сервиса для запуска cron в контейнере (лабораторная работа №3).

services:
  # Сервис, в котором cron запускает скрипт курса валют
  currency_rates:
    # Собираем образ из Dockerfile в текущем каталоге (lab03)
    build: .
    # Постоянное имя контейнера, чтобы его было легко найти в docker ps
    container_name: currency_rates_cron
    # Перезапуск не нужен: контейнер запускается вручную для проверки.
    # Переменные окружения контейнера. entrypoint.sh сохраняет их в /etc/environment,
    # откуда их получают задания cron.
    environment:
      # Ключ API, который скрипт читает из переменной EXCHANGE_API_KEY
      EXCHANGE_API_KEY: EXAMPLE_API_KEY
      # Часовой пояс: задания должны выполняться в 06:00 и 17:00 по времени Кишинёва
      TZ: Europe/Chisinau
    # Связываем имя host.docker.internal с адресом хоста.
    # В Docker Desktop это имя уже есть, а на Linux его нужно добавить так.
    # Через него контейнер обращается к сервису lab02prep на порту 8080 хоста.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Каталог data/ скрипта связываем с каталогом ./data на хосте,
    # чтобы JSON-файлы с результатами были видны вне контейнера
    volumes:
      - ./data:/lab03/data
