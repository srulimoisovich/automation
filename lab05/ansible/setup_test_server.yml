# Что делает этот плейбук с группой webservers: ставит Apache2 и mod_php, готовит каталог и включает сайт gradebook.
# Запуск: ansible-playbook -i hosts.ini setup_test_server.yml (из каталога lab05/ansible).
# Плейбук можно запускать повторно: уже выполненные шаги получают статус ok, а не changed.
- name: Настройка тестового сервера для gradebook
  # Группа из hosts.ini
  hosts: webservers
  # Переменные, общие для задач и шаблона виртуального хоста
  vars:
    # Название сайта, попадает в комментарий файла gradebook.conf
    site_title: Журнал оценок
    # Каталог проекта; Apache отдаёт его подкаталог public
    gradebook_dir: /var/www/gradebook
    # Версия PHP из apt Ubuntu 22.04, от неё зависит путь к php.ini
    php_version: "8.1"

  tasks:
    # become: true нужен потому, что apt устанавливает пакеты от root.
    # update_cache обновляет список пакетов: в образе он удалён после сборки.
    - name: Установка веб-сервера Apache2
      become: true
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true

    # libapache2-mod-php: модуль, который подключает PHP к Apache (включается при установке сам);
    # php-mbstring: строковые функции для UTF-8, страница работает с названиями предметов на кириллице;
    # php-intl: класс NumberFormatter, которым страница печатает средний балл с десятичной запятой.
    # become: установка пакетов требует прав root.
    - name: Установка PHP и расширений
      become: true
      ansible.builtin.apt:
        name:
          - libapache2-mod-php
          - php-mbstring
          - php-intl
        state: present

    # Настройка PHP: часовой пояс Кишинёва, в нём страница показывает время выкладки.
    # regexp находит и закомментированную строку ";date.timezone =", поэтому строка заменяется, а не дублируется.
    # become: файл php.ini принадлежит root.
    - name: Настройка часового пояса PHP
      become: true
      ansible.builtin.lineinfile:
        path: "/etc/php/{{ php_version }}/apache2/php.ini"
        regexp: '^;?date.timezone'
        line: "date.timezone = Europe/Chisinau"
      notify: Перезапуск Apache2

    # После установки пакета Apache в контейнере не запущен, его запускает модуль service.
    # systemd в контейнере нет, поэтому модуль использует сценарий /etc/init.d/apache2.
    # become: управлять службами может только root.
    - name: Запуск Apache2
      become: true
      ansible.builtin.service:
        name: apache2
        state: started

    # Каталог, на который указывает DocumentRoot; файлы в него положит конвейер выкладки.
    # become: /var/www принадлежит root.
    - name: Каталог сайта
      become: true
      ansible.builtin.file:
        path: "{{ gradebook_dir }}/public"
        state: directory
        mode: "0755"

    # Виртуальный хост собирается из шаблона Jinja2 templates/gradebook.conf.j2.
    # become: запись в /etc/apache2 требует прав root.
    - name: Файл виртуального хоста
      become: true
      ansible.builtin.template:
        src: templates/gradebook.conf.j2
        dest: /etc/apache2/sites-available/gradebook.conf
        mode: "0644"
      notify: Перезапуск Apache2

    # a2ensite создаёт ссылку в sites-enabled. Команда всегда завершается успешно,
    # поэтому изменение определяется по выводу: при повторном запуске она печатает
    # "Site gradebook already enabled", и тогда задача получает статус ok.
    # become: sites-enabled принадлежит root.
    - name: Включение сайта gradebook
      become: true
      ansible.builtin.command: a2ensite gradebook
      register: a2ensite_result
      changed_when: "'already enabled' not in a2ensite_result.stdout"
      notify: Перезапуск Apache2

    # Стандартный сайт 000-default тоже слушает порт 80 и отдаёт страницу "It works!",
    # его нужно отключить, чтобы на порт 80 отвечал только gradebook.
    # changed_when работает так же, как в предыдущей задаче ("already disabled").
    - name: Отключение сайта по умолчанию
      become: true
      ansible.builtin.command: a2dissite 000-default
      register: a2dissite_result
      changed_when: "'already disabled' not in a2dissite_result.stdout"
      notify: Перезапуск Apache2

  # Обработчик выполняется один раз в конце плейбука, если о нём сообщила хотя бы одна задача.
  handlers:
    # Именно перезапуск, а не reload: изменение php.ini модуль mod_php читает только при старте Apache.
    - name: Перезапуск Apache2
      become: true
      ansible.builtin.service:
        name: apache2
        state: restarted
