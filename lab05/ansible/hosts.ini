# Инвентарь: какие серверы настраивает Ansible и как к ним подключаться.
# Закрытый ключ здесь не указан: его передаёт Jenkins через ssh-agent (плагин SSH Agent).

# Группа веб-серверов; в этой работе в ней один тестовый сервер.
[webservers]
# Запись test-server ниже не IP-адрес: так назван сервис в compose.yaml, и адрес контейнера
# по этому имени отдаёт встроенный DNS сети jenkins-network. Поэтому ansible_host не указан.
test-server

# Общие параметры подключения для всех серверов группы webservers.
[webservers:vars]
# Пользователь, под которым Ansible входит на сервер по SSH.
ansible_user=ansible
# Python на Ubuntu 22.04 лежит здесь; явное указание убирает автоопределение интерпретатора.
ansible_python_interpreter=/usr/bin/python3
